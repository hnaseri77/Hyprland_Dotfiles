        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
scale = 0.80000000447034836

[plugins]
enabled = []

[shell]
avatar_path = "/home/cat/Documents/satoru-gojo-8k-7680x4320-15315.jpg"
clipboard_image_action_command = "satty -f -"
lang = "en"
launch_apps_as_systemd_services = true
password_style = "random"
polkit_agent = true
settings_show_advanced = true

    [shell.animation]
    speed = 0.65000000968575478

    [shell.greeter_sync]
    auto_sync = true

    [shell.keyboard_layout.custom_labels]
    "English (US)" = "us"
    Persian = "ir"

    [shell.panel]
    open_near_click_clipboard = true
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"

    [shell.screenshot]
    copy_to_clipboard = false
    directory = "/home/cat/Pictures/Screenshots"
    pipe_command = "satty -f -"
    pipe_to_command = true
    save_to_file = true

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[system.monitor]
gpu_poll_seconds = 2

[theme]
builtin = "Noctalia"
community_palette = "Ayu Red"
mode = "dark"
source = "community"
wallpaper_scheme = "m3-rainbow"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "hyprland", "kcolorscheme", "kitty", "qt", "starship" ]
    enable_community_templates = false

[wallpaper]
directory = "/home/cat/Pictures/wallpapers/wallpapers"
per_monitor_directories = true

    [wallpaper.default]
    path = "/home/cat/Pictures/wallpapers/wallpapers/ps4-controller-playstation-4-controller-gamepad-game-3840x2160-8380.png"

    [wallpaper.last]
    path = "/home/cat/Pictures/wallpapers/wallpapers/Sword Black.png"

    [wallpaper.monitor.eDP-1]
    directory_light = ""

    [wallpaper.monitors.DP-1]
    path = "/home/cat/Pictures/wallpapers/wallpapers/Sword Black.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/cat/Pictures/wallpapers/wallpapers/4kwall-lyj56q-3840x1750.jpg"

[weather]
enabled = false

[widget.active_window]
enabled = false

[widget.battery]
color = "secondary"

[widget.bluetooth]
color = "secondary"

[widget.clock]
color = "secondary"
format = "{:%H:%M %A %m/%d/%y}"

[widget.keyboard_layout]
color = "secondary"

[widget.launcher]
color = "secondary"

[widget.media]
enabled = false
hide_when_no_media = true
