[accessibility]
ui_scale = 1.0000000074505806

[audio]
enable_overdrive = true

[bar.default]
capsule_thickness = 0.65999998897314072
center = [ "workspaces", "spacer_2", "active_window" ]
concave_edge_corners = false
end = [
    "media",
    "spacer_1",
    "tray",
    "notifications",
    "keyboard_layout",
    "network",
    "bluetooth",
    "battery",
    "volume",
    "session"
]
margin_edge = 7
margin_ends = 18
panel_overlap = 0
radius = 0
radius_bottom_left = 16
radius_bottom_right = 16
radius_top_left = 16
radius_top_right = 16
scale = 0.95000000670552254
start = [ "launcher", "clock", "spacer_1", "group:g1" ]
thickness = 35

    [[bar.default.capsule_group]]
    border = ""
    fill = "on_secondary"
    id = "g1"
    members = [ "temp", "sysmon_2", "sysmon_3" ]
    opacity = 1.0
    padding = 6.0

[battery]
warning_threshold = 20

[control_center]
hidden_tabs = [ "weather" ]

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 1200.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 86400.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 1800.0

[lockscreen]
blur_intensity = 0.099999997764825821
wallpaper = "/home/cat/Pictures/wallpapers/wallpapers/anime-girl-school.jpg"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 8
    major_interval = 4
    visible = true

